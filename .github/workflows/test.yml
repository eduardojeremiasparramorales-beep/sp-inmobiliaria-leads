name: Tests

# Corre la suite de Vitest en cada push/PR — Fase 2 del plan de modernización
# (docs/AUDITORIA_2026-08.md 3.4). Antes de esto, cada fix se probaba a mano y se
# desplegaba directo a producción; esto es lo mínimo para que un test de regresión
# (p. ej. el de tiempo.js) atrape en CI lo que antes solo se descubría en producción.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
