<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leons Group">
<title>Leons Group · Móvil</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/os/theme.js"></script>
<script src="/os/safe-area.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
<link rel="stylesheet" href="/m/app.css">
<!-- Leaflet se carga LAZY desde /vendor/leaflet solo cuando hay un mapa que mostrar -->
</head>
<body>
<div id="app">
  <!-- ══ Home · Conversaciones ══ -->
  <section class="screen" id="scHome">
    <header class="m-head">
      <div class="m-head__top">
        <div class="m-mark"><img src="/icons/logo.png" alt="SP Leons Group"></div>
        <div class="m-title" id="navTitle">Conversaciones<small id="navSub">Leons Group</small></div>
        <button class="m-headbtn" id="btnPrioridad" aria-label="Ordenar por prioridad" title="Ordenar por prioridad">🔥</button>
        <button class="m-headbtn" id="btnNotif" aria-label="Notificaciones" style="position:relative"><span id="notifBadge" style="display:none;position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:var(--gold);color:#0A0A0A;font-size:9px;font-weight:700;line-height:15px;text-align:center;z-index:2"></span></button>
        <div class="m-avatar" id="meAvatar" style="width:30px;height:30px;border-radius:10px;font-size:11px;cursor:pointer;overflow:hidden"></div>
      </div>
      <label class="m-search"><span id="icSearch"></span><input id="q" placeholder="Buscar cliente, chat, etiqueta…" autocomplete="off"></label>
    </header>
    <div class="perm-banner" id="updBanner" hidden>
      <span class="ic">⬆️</span>
      <span class="tx" id="updBannerTxt">Hay una nueva versión de la app</span>
      <button id="updBannerBtn">Actualizar</button>
      <button class="perm-x" id="updBannerX" aria-label="Cerrar">✕</button>
    </div>
    <div class="perm-banner" id="permBanner" hidden>
      <span class="ic">🎙️</span>
      <span class="tx" id="permBannerTxt">Activa el micrófono para enviar notas de voz</span>
      <button id="permBannerBtn">Activar</button>
      <button class="perm-x" id="permBannerX" aria-label="Cerrar">✕</button>
    </div>
    <div class="m-filters" id="filters"></div>
    <div class="m-scroll" id="list">
      <div class="m-ptr" id="ptr"><span class="spin"></span></div>
    </div>
    <button class="m-fab" id="fab" aria-label="Nuevo"></button>
  </section>

  <!-- ══ Chat ══ -->
  <section class="screen screen--chat" id="scChat"></section>

  <!-- ══ Actualización de la app (estilo Free Fire) ══ -->
  <section class="screen screen--update" id="scUpdate">
    <div class="upd-card">
      <div class="upd-logo"><img src="/icons/logo.png" alt="Leons Group"></div>
      <h2>Nueva versión</h2>
      <div class="upd-ver" id="updVer"></div>
      <div class="upd-notas" id="updNotas"></div>
      <div class="upd-bar" hidden id="updBar"><div class="upd-bar__fill" id="updFill"></div></div>
      <div class="upd-pct" id="updPct"></div>
      <button class="upd-btn" id="updBtn">Actualizar ahora</button>
      <button class="upd-later" id="updLater" hidden>Más tarde</button>
    </div>
  </section>

  <!-- ══ Chat interno Equipo Leons ══ -->
  <section class="screen screen--chat" id="scEquipo">
    <div class="eq-banner" id="eqBanner">
      <button class="eq-banner__back" id="eqBack"></button>
      <div id="eqBannerContent"></div>
      <div class="eq-typing" id="eqTyping"><div class="eq-typing__dots"><span></span><span></span><span></span></div><span id="eqTypingName"></span></div>
    </div>
    <div id="eqTabs" style="display:flex;gap:6px;padding:8px 12px 4px;overflow-x:auto;border-bottom:1px solid var(--border-soft)"></div>
    <div id="eqPinBanner" class="eq-pin-banner"></div>
    <div id="eqReplyBar" style="display:none;padding:8px 14px;background:rgba(200,164,90,.08);border-top:1px solid var(--gold);border-bottom:1px solid var(--border-soft);align-items:center;gap:8px">
      <div style="flex:1;min-width:0"><div id="eqReplyLabel" style="font-size:11px;font-weight:700;color:var(--gold)"></div><div id="eqReplyPreview" style="font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div>
      <button onclick="eqCancelReply()" style="background:none;border:none;color:var(--text-3);font-size:18px;cursor:pointer;padding:4px">✕</button>
    </div>
    <div class="m-scroll" id="eqMsgs" style="padding:12px 14px;position:relative"></div>
    <button class="eq-scroll-bottom" id="eqScrollBtn"></button>
    <div id="eqRecBar" class="eq-rec-bar">
      <div class="eq-rec-dot"></div>
      <span class="eq-rec-time" id="eqRecTime">0:00</span>
      <button class="eq-rec-cancel" id="eqRecCancel">Cancelar</button>
      <button class="eq-rec-send" id="eqRecSend"></button>
    </div>
    <div style="display:flex;gap:8px;padding:8px 12px calc(8px + var(--safe-b));background:var(--glass);backdrop-filter:var(--blur-sm);-webkit-backdrop-filter:var(--blur-sm);border-top:1px solid var(--glass-border);position:relative">
      <button id="eqClipBtn" style="width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-3);color:var(--text-2);display:grid;place-items:center;cursor:pointer;flex-shrink:0"></button>
      <button id="eqMicBtn" style="width:36px;height:36px;border-radius:50%;border:none;background:var(--bg-3);color:var(--text-2);display:grid;place-items:center;cursor:pointer;flex-shrink:0"></button>
      <textarea id="eqInput" placeholder="Mensaje al equipo…" rows="1" style="flex:1;min-height:40px;max-height:100px;padding:10px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-3);color:var(--text);font-size:14px;font-family:inherit;outline:none;resize:none"></textarea>
      <button id="eqSend" style="width:42px;height:42px;border-radius:50%;border:none;background:var(--grad-gold);color:#0A0A0A;display:grid;place-items:center;cursor:pointer;flex-shrink:0"></button>
    </div>
  </section>

  <!-- ══ Bloqueo con huella ══ -->
  <div id="bioLock" style="display:none;position:fixed;inset:0;z-index:200;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,10,10,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)">
    <div style="width:72px;height:72px;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 0 1px rgba(200,164,90,.28)"><img src="/icons/logo.png" alt="" style="width:100%;height:100%;object-fit:cover"></div>
    <div style="font-family:var(--f-title);font-size:16px;letter-spacing:.08em;color:var(--gold)">LEONS GROUP</div>
    <div style="font-size:13px;color:var(--text-2)">Desbloquea con tu huella</div>
    <button id="bioUnlock" style="margin-top:8px;height:46px;padding:0 28px;border:none;border-radius:12px;background:var(--grad-gold);color:#0A0A0A;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer">Desbloquear</button>
    <div id="bioError" style="display:none;font-size:12px;color:#e55;margin-top:4px"></div>
  </div>

  <!-- ══ Bottom Nav ══ -->
  <nav class="m-nav" id="nav"></nav>

  <!-- ══ Sheet ══ -->
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="sheet__grab"></div>
    <div class="sheet__head"><div class="sheet__title" id="sheetTitle">—</div><button class="sheet__x" id="sheetX"></button></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>

  <div class="m-toast" id="toast"></div>

  <!-- ══ Lightbox preview ══ -->
  <div class="lb" id="lb"><button class="lb-close" id="lbClose">✕</button><img id="lbImg" src=""><div class="lb-counter" id="lbCounter"></div></div>
</div>

<script src="/sw-reg.js"></script>
<!-- window.SPMapa: núcleo de mapas compartido con el panel admin. Va antes de app.js,
     que lo usa desde el tab Mapa, el picker de ubicación y los mensajes de ubicación.
     Leaflet en sí sigue siendo perezoso: lo trae SPMapa cuando hace falta. -->
<script src="/shared/mapa-base.js"></script>
<script src="/m/app.js"></script>
</body>
</html>
