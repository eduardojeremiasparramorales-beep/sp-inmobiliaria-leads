<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Leons Group · Mapa del equipo</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
</head>
<body>
<script src="/os/sp-shell.js"></script>
<!-- mapa-base.js define window.SPMapa; mapa-core.js lo consume, así que va antes. -->
<script src="/shared/mapa-base.js"></script>
<script src="/os/mapa-core.js"></script>
<script>
(async function () {
  const ctx = await SPOS.mount({ active: 'mapa', title: 'Mapa del equipo', crumb: 'Operación · Ubicación en vivo', padded: true });
  if (!ctx) return;
  await MapaEquipo.montar({
    content: ctx.content,
    api: SPOS.api,
    toast: SPOS.toast,
    esc: SPOS.esc,
    // El shell admin ya mantiene UNA sola conexión SSE compartida; SPOS.on la reusa.
    onStream: (fn) => SPOS.on('ubicacion_asesor', fn),
  });
})();
</script>
</body>
</html>
