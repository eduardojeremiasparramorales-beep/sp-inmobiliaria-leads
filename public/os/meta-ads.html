<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Leons Group · Meta Ads</title><link rel="stylesheet" href="/fonts/fonts.css">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
<style>
  .ma-page { max-width: 1120px; margin: 0 auto; }

  /* KPI strip */
  .ma-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .ma-kpi { background: var(--bg-1); border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px; text-align: center; }
  .ma-kpi__val { font-size: 22px; font-weight: 700; color: var(--gold); font-family: var(--f-title); }
  .ma-kpi__label { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; margin-top: 4px; }

  /* Sections */
  .ma-sec { background: var(--bg-1); border: 1px solid var(--border-soft); border-radius: var(--r); padding: var(--s3); margin-bottom: var(--s3); }
  .ma-sec h3 { font-family: var(--f-title); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .ma-sec p { font-size: 12.5px; color: var(--text-3); margin-bottom: var(--s2); }

  /* Top nav (reemplaza los tabs planos por rutas navegables con historial) */
  .ma-nav { display: flex; gap: 4px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .ma-nav a { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg-3); color: var(--text-3); border: none; font-family: var(--f-ui); transition: all .15s; text-decoration: none; }
  .ma-nav a.active { background: rgba(200,164,90,.15); color: var(--gold); }
  .ma-nav a:hover:not(.active) { color: var(--text); }
  .ma-crumb { font-size: 12px; color: var(--text-3); margin-bottom: 14px; }
  .ma-crumb a { color: var(--gold); cursor: pointer; text-decoration: none; }
  .ma-crumb a:hover { text-decoration: underline; }

  /* Campaign / adset / ad cards */
  .ma-camp { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; background: var(--bg-2); transition: border-color .15s; cursor: pointer; }
  .ma-camp:hover { border-color: var(--gold); }
  .ma-camp__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
  .ma-camp__name { font-size: 14px; font-weight: 600; }
  .ma-camp__meta { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
  .ma-camp__metrics { display: flex; gap: 14px; flex-wrap: wrap; margin: 8px 0; }
  .ma-camp__metric { text-align: center; min-width: 60px; }
  .ma-camp__metric-val { font-size: 15px; font-weight: 600; color: var(--text); }
  .ma-camp__metric-lbl { font-size: 9.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .ma-camp__actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .ma-camp__actions button, .ma-camp__actions a { position: relative; z-index: 2; }

  .ma-ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .ma-ad-card { border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: var(--bg-2); }
  .ma-ad-card__img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; background: var(--bg-3); margin-bottom: 8px; }
  .ma-ad-card__name { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; }
  .ma-ad-card__actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  /* Buttons */
  .ma-btn { height: 34px; padding: 0 16px; background: var(--bg-3); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-sm); font-weight: 600; font-size: 12px; cursor: pointer; font-family: var(--f-ui); transition: all .15s; }
  .ma-btn:hover { border-color: var(--gold); color: var(--gold); }
  .ma-btn--gold { background: var(--gold); color: #000; border-color: var(--gold); }
  .ma-btn--gold:hover { background: #d4af5a; }
  .ma-btn--danger { background: rgba(192,57,43,.15); color: #e74c3c; border-color: rgba(192,57,43,.3); }
  .ma-btn--danger:hover { background: rgba(192,57,43,.25); }
  .ma-btn--green { background: rgba(78,123,70,.15); color: var(--green); border-color: rgba(78,123,70,.3); }
  .ma-btn--green:hover { background: rgba(78,123,70,.25); }
  .ma-btn--xs { height: 26px; padding: 0 10px; font-size: 10.5px; }
  .ma-btn:disabled { opacity: .4; cursor: default; pointer-events: none; }

  /* Badge */
  .ma-badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
  .ma-badge--active { background: rgba(78,123,70,.18); color: var(--green); }
  .ma-badge--paused { background: rgba(200,164,90,.18); color: var(--gold); }
  .ma-badge--error { background: rgba(255,80,80,.15); color: #ff5050; }
  .ma-badge--archived, .ma-badge--deleted { background: rgba(150,150,150,.15); color: var(--text-3); }

  /* Not configured / error banners */
  .ma-banner { background: linear-gradient(135deg, rgba(200,164,90,.08), rgba(200,164,90,.02)); border: 1px solid rgba(200,164,90,.2); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 20px; }
  .ma-banner h4 { font-family: var(--f-title); color: var(--gold); font-size: 14px; margin-bottom: 8px; }
  .ma-banner p { font-size: 12.5px; color: var(--text-3); max-width: 500px; margin: 0 auto 14px; }
  .ma-banner code { display: block; background: var(--bg-3); border-radius: 6px; padding: 10px; font-size: 11px; color: var(--text-2); text-align: left; margin-top: 10px; overflow-x: auto; white-space: pre; }
  .ma-error { background: rgba(255,80,80,.08); border: 1px solid rgba(255,80,80,.25); border-radius: 12px; padding: 20px; text-align: center; }
  .ma-error p { font-size: 12.5px; color: var(--text-2); margin-bottom: 12px; }

  /* Chart area */
  .ma-chart { position: relative; height: 180px; background: var(--bg-2); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; margin: 12px 0; }
  .ma-chart canvas { width: 100% !important; height: 100% !important; }

  /* Audiences list */
  .ma-aud { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; background: var(--bg-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ma-aud__info { flex: 1; min-width: 160px; }
  .ma-aud__name { font-size: 13px; font-weight: 600; }
  .ma-aud__meta { font-size: 11px; color: var(--text-3); }
  .ma-aud__actions { display: flex; gap: 6px; flex-wrap: wrap; }

  /* Empty / loading state */
  .ma-empty { text-align: center; padding: 30px; color: var(--text-3); font-size: 13px; }
  .ma-loading { display: flex; align-items: center; justify-content: center; padding: 30px; color: var(--text-3); font-size: 12px; gap: 8px; }
  .ma-spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: ma-spin .6s linear infinite; }
  @keyframes ma-spin { to { transform: rotate(360deg); } }

  /* Formularios */
  .ma-form-row { margin-bottom: 16px; }
  .ma-form-row label { display: block; font-size: 11.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; font-weight: 600; }
  .ma-form-row input[type="text"], .ma-form-row input[type="number"], .ma-form-row input[type="url"], .ma-form-row textarea, .ma-form-row select {
    width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 10px 12px; color: var(--text); font-size: 13.5px; font-family: var(--f-ui); outline: none; transition: border-color .15s;
  }
  .ma-form-row input:focus, .ma-form-row textarea:focus, .ma-form-row select:focus { border-color: var(--gold); }
  .ma-form-row textarea { resize: vertical; min-height: 70px; }
  .ma-form-hint { font-size: 11px; color: var(--text-3); margin-top: 5px; }
  .ma-form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .ma-form-grid2--budget { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  .ma-safety { background: rgba(78,123,70,.1); border: 1px solid rgba(78,123,70,.28); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: var(--text-2); margin-bottom: 18px; display: flex; gap: 10px; align-items: flex-start; }
  .ma-safety b { color: var(--green); }

  .ma-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 0; }
  .ma-chip { display: flex; align-items: center; gap: 6px; background: var(--gold-soft, rgba(200,164,90,.16)); border: 1px solid var(--gold-line, rgba(200,164,90,.4)); color: var(--gold); border-radius: 999px; padding: 5px 6px 5px 12px; font-size: 12px; font-weight: 600; }
  .ma-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 2px 4px; opacity: .7; }
  .ma-chip button:hover { opacity: 1; }
  .ma-search-results { position: relative; }
  .ma-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--bg-3); border: 1px solid var(--border-strong); border-radius: var(--r-sm); max-height: 220px; overflow-y: auto; z-index: 20; box-shadow: var(--sh-2); }
  .ma-dd-opt { padding: 9px 12px; font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; }
  .ma-dd-opt:hover { background: var(--bg-4); color: var(--gold); }
  .ma-dd-opt small { color: var(--text-3); }

  .ma-seg { display: flex; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
  .ma-seg button { flex: 1; min-width: 90px; height: 36px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg-2); color: var(--text-2); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--f-ui); }
  .ma-seg button.active { background: rgba(200,164,90,.15); border-color: var(--gold-line); color: var(--gold); }

  .ma-check-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-soft); border-radius: var(--r-sm); padding: 8px; }
  .ma-check-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 12.5px; cursor: pointer; }
  .ma-check-row input { width: auto; }

  .ma-image-drop { border: 1.5px dashed var(--border-strong); border-radius: var(--r-sm); padding: 18px; text-align: center; cursor: pointer; transition: border-color .15s; background: var(--bg-2); }
  .ma-image-drop:hover, .ma-image-drop.dragover { border-color: var(--gold); }
  .ma-image-preview { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin: 0 auto 10px; }
  .ma-thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; }
  .ma-thumb { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
  .ma-thumb img, .ma-thumb video { width: 100%; height: 70px; object-fit: cover; display: block; }
  .ma-thumb button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; border: none; cursor: pointer; font-size: 11px; line-height: 1; }

  .ma-card-editor { border: 1px solid var(--border-soft); border-radius: var(--r-sm); padding: 12px; margin-bottom: 10px; background: var(--bg-2); display: flex; gap: 10px; }
  .ma-card-editor img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .ma-card-editor__fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .ma-card-editor__fields input { width: 100%; background: var(--bg-3); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; color: var(--text); font-size: 12px; outline: none; }

  .ma-review { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 14px 16px; }
  .ma-review dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12.5px; margin: 0; }
  .ma-review dt { color: var(--text-3); }
  .ma-review dd { margin: 0; color: var(--text); font-weight: 500; }

  .ma-preview-frame { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: #f0f2f5; min-height: 300px; }
  .ma-preview-frame iframe { border: none; width: 100%; min-height: 500px; }

  /* Modal genérico (picker de Campañas SP, preview de anuncio) */
  .ma-modal-ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .ma-modal { background: var(--bg-1); border: 1px solid var(--border); border-radius: 18px; width: 100%; max-width: 640px; max-height: 86vh; overflow-y: auto; padding: 22px; }
  .ma-modal h3 { font-family: var(--f-title); font-size: 15px; margin-bottom: 4px; }
  .ma-modal__close { float: right; background: none; border: none; color: var(--text-3); font-size: 18px; cursor: pointer; }
  .ma-csp-project { border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font-size: 12.5px; }
  .ma-csp-project:hover { border-color: var(--gold-line); }
  .ma-csp-asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-top: 10px; }
  .ma-csp-asset { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid transparent; cursor: pointer; }
  .ma-csp-asset img, .ma-csp-asset video { width: 100%; height: 80px; object-fit: cover; display: block; }
  .ma-csp-asset.selected { border-color: var(--gold); }
  .ma-csp-asset.selected::after { content: '✓'; position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: var(--gold); color: #000; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .ma-steps { display: flex; gap: 4px; margin-bottom: 20px; }
  .ma-step { flex: 1; padding: 8px 10px; border-radius: 8px; font-size: 10.5px; font-weight: 600; text-align: center; background: var(--bg-3); color: var(--text-3); }
  .ma-step.active { background: rgba(200,164,90,.15); color: var(--gold); }
  .ma-step.done { background: rgba(78,123,70,.15); color: var(--green); }

  @media (max-width: 720px) {
    .ma-form-grid2, .ma-form-grid2--budget { grid-template-columns: 1fr; }
    .ma-camp__top { flex-wrap: wrap; gap: 6px; }
    .ma-camp__actions { flex-wrap: wrap; }
    .ma-steps { flex-wrap: wrap; }
    .ma-step { min-width: 30%; }
    .ma-card-editor { flex-direction: column; }
  }
</style>
</head>
<body>
<script src="/os/sp-shell.js"></script>
<script>
(async function () {
  'use strict';
  const { api, toast } = SPOS;
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const fmt = n => (n == null ? '—' : n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n));
  const fmtMoney = n => { const v = Number(n); return '$' + (isNaN(v) ? 0 : v).toLocaleString('es-CO', { maximumFractionDigits: 0 }); };
  const fmtPct = n => (n == null ? '—' : Number(n).toFixed(2) + '%');

  const ctx = await SPOS.mount({
    active: 'meta-ads', title: 'Meta Ads', crumb: 'Marketing · Publicidad', padded: true, adminOnly: true,
  });
  if (!ctx) return;

  // ─── Estado global ──────────────────────
  let status = null;
  let account = null;
  let audiencesCache = null;

  // ─── Router por hash: #/campaigns, #/campaign/ID, #/adset/ID, #/wizard, #/audiencias
  function currentRoute() {
    const h = (location.hash || '#/campaigns').replace(/^#\/?/, '');
    const [name, id] = h.split('/');
    return { name: name || 'campaigns', id: id ? decodeURIComponent(id) : null };
  }
  function navigate(hash) { location.hash = hash; }
  window.addEventListener('hashchange', render);

  function renderNav(route) {
    const items = [
      { hash: '#/campaigns', label: 'Campañas', match: r => r.name === 'campaigns' || r.name === 'campaign' || r.name === 'adset' },
      { hash: '#/wizard', label: '+ Crear campaña', match: r => r.name === 'wizard' },
      { hash: '#/audiencias', label: 'Audiencias', match: r => r.name === 'audiencias' },
      { hash: '#/recomendaciones', label: '💡 Recomendaciones', match: r => r.name === 'recomendaciones' },
    ];
    return `<div class="ma-nav">${items.map(it => `<a href="${it.hash}" class="${it.match(route) ? 'active' : ''}">${it.label}</a>`).join('')}</div>`;
  }

  function errorPanel(e, retryFn) {
    const box = document.createElement('div');
    box.className = 'ma-error';
    const userMsg = e && e.userMessage;
    box.innerHTML = `
      <p><b>No se pudo cargar esta sección.</b></p>
      <p>${esc(userMsg || (e && e.detalle) || (e && e.message) || 'Error desconocido')}</p>
      <button class="ma-btn ma-btn--gold" id="maRetry">Reintentar</button>
    `;
    box.querySelector('#maRetry').addEventListener('click', retryFn);
    return box;
  }

  // Wrapper: cada sección carga sus propios datos y se protege sola — si truena,
  // solo esa sección muestra el error con botón reintentar, el resto de la página
  // (nav, KPIs ya cargados) sigue intacto. Antes una excepción sin capturar durante
  // el render abortaba TODO y dejaba la página pegada mostrando un estado viejo.
  async function renderSection(container, fn) {
    container.innerHTML = '<div class="ma-loading"><div class="ma-spinner"></div> Cargando…</div>';
    try {
      await fn(container);
    } catch (e) {
      console.error('[META-ADS]', e);
      container.innerHTML = '';
      container.appendChild(errorPanel(e, () => renderSection(container, fn)));
    }
  }

  async function apiOrThrow(path, opts) {
    const r = await api(path, opts);
    if (r && r.error) { const e = new Error(r.detalle || r.error); e.detalle = r.detalle; e.userMessage = r.userMessage; e.error = r.error; throw e; }
    if (r === null) throw new Error('Sin conexión con el servidor');
    return r;
  }

  // ─── Render raíz ────────────────────────
  async function render() {
    const route = currentRoute();
    if (!status) {
      ctx.content.innerHTML = '<div class="ma-page"><div class="ma-loading"><div class="ma-spinner"></div> Cargando Meta Ads…</div></div>';
      status = await api('/api/meta-ads/status');
    }
    if (!status || !status.configured) {
      ctx.content.innerHTML = `<div class="ma-page">${renderNotConfigured()}</div>`;
      return;
    }
    if (!account) account = await api('/api/meta-ads/account') || {};

    ctx.content.innerHTML = `
      <div class="ma-page">
        ${renderKPIs()}
        ${renderNav(route)}
        <div id="maBody"></div>
      </div>`;
    const body = document.getElementById('maBody');

    if (route.name === 'campaign' && route.id) return renderSection(body, (el) => renderCampaignDetail(el, route.id));
    if (route.name === 'adset' && route.id) return renderSection(body, (el) => renderAdsetDetail(el, route.id));
    if (route.name === 'wizard') return renderSection(body, (el) => renderWizard(el));
    if (route.name === 'audiencias') return renderSection(body, (el) => renderAudiencesView(el));
    if (route.name === 'recomendaciones') return renderSection(body, (el) => renderRecommendations(el));
    return renderSection(body, (el) => renderCampaignsList(el));
  }

  function renderNotConfigured() {
    return `
      <div class="ma-banner">
        <h4>Meta Ads no está configurado</h4>
        <p>Configura el token y la cuenta de Meta Ads para empezar a ver y crear campañas.</p>
      </div>
      <div class="ma-sec">
        <h3>Pasos para configurar</h3>
        <div style="font-size:12.5px; color:var(--text-2); line-height:1.8;">
          <strong>1.</strong> Ir a <a href="https://developers.facebook.com" target="_blank" style="color:var(--gold)">developers.facebook.com</a> → crear app tipo "Business" → producto "Marketing API"<br>
          <strong>2.</strong> Solicitar permisos <code>ads_management</code>, <code>ads_read</code>, <code>business_management</code> y crear un System User con token permanente<br>
          <strong>3.</strong> Copiar el Ad Account ID desde Business Suite → Configuración → Cuentas de anuncios<br>
          <strong>4.</strong> Ir a <a href="/os/configuracion.html" style="color:var(--gold)">Configuración → Meta Ads</a> y pegar el token, la cuenta, el Pixel (opcional) y el Page ID
        </div>
        <a class="ma-btn ma-btn--gold" href="/os/configuracion.html" style="display:inline-block;margin-top:10px;text-decoration:none">Ir a Configuración</a>
      </div>
    `;
  }

  function renderKPIs() {
    const s = status || {};
    return `
      <div class="ma-kpis">
        <div class="ma-kpi"><div class="ma-kpi__val">${s.activeCampaigns || 0}</div><div class="ma-kpi__label">Activas</div></div>
        <div class="ma-kpi"><div class="ma-kpi__val">${s.campaigns || 0}</div><div class="ma-kpi__label">Total campañas</div></div>
        <div class="ma-kpi"><div class="ma-kpi__val">${fmtMoney(s.totalSpend || 0)}</div><div class="ma-kpi__label">Gasto (30d)</div></div>
        <div class="ma-kpi"><div class="ma-kpi__val">${fmt(s.totalLeads || 0)}</div><div class="ma-kpi__label">Leads Meta (30d)</div></div>
        <div class="ma-kpi"><div class="ma-kpi__val">${s.totalLeads > 0 ? fmtMoney(Math.round(s.totalSpend / s.totalLeads)) : '—'}</div><div class="ma-kpi__label">CPL promedio</div></div>

  // ════════════════════════════════════════════════════════════
  // VISTA: Lista de campañas
  // ════════════════════════════════════════════════════════════
  async function renderCampaignsList(el) {
    const campaigns = await apiOrThrow('/api/meta-ads/campaigns');
    if (!Array.isArray(campaigns) || !campaigns.length) {
      el.innerHTML = '<div class="ma-empty">No hay campañas en esta cuenta todavía. Crea la primera con "+ Crear campaña".</div>';
      return;
    }
    el.innerHTML = campaigns.map(c => campaignCardHtml(c)).join('');
    el.querySelectorAll('.ma-camp').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.closest('button')) return; // los botones de acción no navegan
        navigate('#/campaign/' + encodeURIComponent(card.dataset.id));
      });
    });
    bindCampaignActions(el, () => renderSection(el, renderCampaignsList));
  }

  function campaignCardHtml(c) {
    const m = c.metrics || {};
    const statusClass = c.status === 'ACTIVE' ? 'active' : c.status === 'PAUSED' ? 'paused' : c.status === 'ARCHIVED' ? 'archived' : c.status === 'DELETED' ? 'deleted' : 'error';
    const statusLabel = { ACTIVE: 'Activa', PAUSED: 'Pausada', ARCHIVED: 'Archivada', DELETED: 'Borrada' }[c.status] || c.status;
    const budget = c.daily_budget ? fmtMoney(c.daily_budget) + '/día' : (c.lifetime_budget ? fmtMoney(c.lifetime_budget) + ' total' : 'presupuesto en el conjunto');
    return `
      <div class="ma-camp" data-id="${esc(c.id)}">
        <div class="ma-camp__top">
          <div>
            <div class="ma-camp__name">${esc(c.name)}</div>
            <div class="ma-camp__meta">${esc(c.objective || '')} · ${budget}</div>
          </div>
          <span class="ma-badge ma-badge--${statusClass}">${statusLabel}</span>
        </div>
        ${m.impressions !== undefined ? `
        <div class="ma-camp__metrics">
          <div class="ma-camp__metric"><div class="ma-camp__metric-val">${fmt(m.impressions)}</div><div class="ma-camp__metric-lbl">Impresiones</div></div>
          <div class="ma-camp__metric"><div class="ma-camp__metric-val">${fmtPct(m.ctr)}</div><div class="ma-camp__metric-lbl">CTR</div></div>
          <div class="ma-camp__metric"><div class="ma-camp__metric-val">${fmtMoney(m.spend)}</div><div class="ma-camp__metric-lbl">Gasto</div></div>
          <div class="ma-camp__metric"><div class="ma-camp__metric-val">${fmt(m.leads)}</div><div class="ma-camp__metric-lbl">Leads CRM</div></div>
          <div class="ma-camp__metric"><div class="ma-camp__metric-val">${m.cpl ? fmtMoney(Math.round(m.cpl)) : '—'}</div><div class="ma-camp__metric-lbl">CPL</div></div>
        </div>` : '<div style="font-size:11.5px;color:var(--text-3);margin:6px 0">Sin métricas disponibles</div>'}
        <div class="ma-camp__actions">
          ${c.status === 'ACTIVE'
            ? `<button class="ma-btn ma-btn--danger ma-btn--xs" data-pause="${esc(c.id)}">Pausar</button>`
            : (c.status === 'PAUSED' ? `<button class="ma-btn ma-btn--green ma-btn--xs" data-resume="${esc(c.id)}">Reanudar</button>` : '')}
          <button class="ma-btn ma-btn--xs" data-dup="${esc(c.id)}">Duplicar</button>
          ${c.status !== 'ARCHIVED' && c.status !== 'DELETED' ? `<button class="ma-btn ma-btn--xs" data-archive="${esc(c.id)}">Archivar</button>` : ''}
        </div>
      </div>
    `;
  }

  // Acciones compartidas entre la lista y el detalle de campaña.
  function bindCampaignActions(root, onDone) {
    root.querySelectorAll('[data-pause]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Pausar esta campaña? Deja de mostrarse de inmediato.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.pause)}/pause`, { method: 'PUT' });
      if (r && r.ok) { toast('Campaña pausada', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    root.querySelectorAll('[data-resume]').forEach(btn => btn.addEventListener('click', async () => {
      // "Reanudar" reactiva gasto real — antes era el único botón sin confirmación.
      if (!confirm('¿Reanudar esta campaña? Esto reactiva el gasto real en Meta.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.resume)}/resume`, { method: 'PUT' });
      if (r && r.ok) { toast('Campaña reanudada', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    root.querySelectorAll('[data-dup]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Duplicar esta campaña? La copia se crea PAUSADA.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.dup)}/duplicate`, { method: 'POST' });
      if (r && r.ok) { toast('Campaña duplicada (pausada)', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    root.querySelectorAll('[data-archive]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Archivar esta campaña? Puedes recuperarla desde Ads Manager.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.archive)}/archive`, { method: 'POST' });
      if (r && r.ok) { toast('Campaña archivada', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    root.querySelectorAll('[data-delete]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿BORRAR esta campaña? Esta acción no se puede deshacer desde el panel.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.delete)}`, { method: 'DELETE' });
      if (r && r.ok) { toast('Campaña borrada', 'ok'); navigate('#/campaigns'); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
  }

  function errMsg(r) { return (r && (r.userMessage || r.detalle || r.error)) || 'desconocido'; }

  // ════════════════════════════════════════════════════════════
  // VISTA: Detalle de campaña (drill-down completo en 1 llamada)
  // ════════════════════════════════════════════════════════════
  function budgetInfo(entity) {
    const daily = entity && entity.daily_budget != null && Number(entity.daily_budget) > 0;
    const lifetime = entity && entity.lifetime_budget != null && Number(entity.lifetime_budget) > 0;
    if (daily) return { mode: 'daily', value: Number(entity.daily_budget), label: 'Diario' };
    if (lifetime) return { mode: 'lifetime', value: Number(entity.lifetime_budget), label: 'Total' };
    return { mode: null, value: null, label: '—' };
  }

  // ─── Gráfico sin dependencias externas (líneas de gasto y leads) ──
  function drawChart(canvas, insights) {
    if (!canvas || !insights.length) return;
    const ctx2 = canvas.getContext('2d');
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * 2; canvas.height = rect.height * 2;
    ctx2.scale(2, 2);
    const W = rect.width, H = rect.height;
    const pad = { t: 20, r: 10, b: 24, l: 55 };
    const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
    const maxSpend = Math.max(...insights.map(d => d.spend), 1);
    const maxLeads = Math.max(...insights.map(d => d.leads), 1);

    ctx2.strokeStyle = 'rgba(255,255,255,.06)'; ctx2.lineWidth = 0.5;
    for (let i = 0; i <= 4; i++) { const y = pad.t + (cH / 4) * i; ctx2.beginPath(); ctx2.moveTo(pad.l, y); ctx2.lineTo(pad.l + cW, y); ctx2.stroke(); }

    ctx2.strokeStyle = '#C8A45A'; ctx2.lineWidth = 2; ctx2.beginPath();
    insights.forEach((d, i) => { const x = pad.l + (cW / (insights.length - 1 || 1)) * i; const y = pad.t + cH - (d.spend / maxSpend) * cH; i === 0 ? ctx2.moveTo(x, y) : ctx2.lineTo(x, y); });
    ctx2.stroke();

    ctx2.strokeStyle = '#4E7B46'; ctx2.lineWidth = 2; ctx2.beginPath();
    insights.forEach((d, i) => { const x = pad.l + (cW / (insights.length - 1 || 1)) * i; const y = pad.t + cH - (d.leads / maxLeads) * cH; i === 0 ? ctx2.moveTo(x, y) : ctx2.lineTo(x, y); });
    ctx2.stroke();

    ctx2.font = '10px Inter, sans-serif';
    ctx2.fillStyle = '#C8A45A'; ctx2.fillRect(pad.l, 4, 12, 3); ctx2.fillText('Gasto', pad.l + 16, 9);
    ctx2.fillStyle = '#4E7B46'; ctx2.fillRect(pad.l + 60, 4, 12, 3); ctx2.fillText('Leads', pad.l + 76, 9);

    ctx2.fillStyle = 'rgba(255,255,255,.4)'; ctx2.textAlign = 'right';
    for (let i = 0; i <= 4; i++) { const y = pad.t + (cH / 4) * i; const val = maxSpend - (maxSpend / 4) * i; ctx2.fillText(fmtMoney(Math.round(val)), pad.l - 4, y + 3); }
  }

      if (r && r.ok) { toast('Anuncio actualizado', 'ok'); renderSection(el, (e2) => renderAdsetDetail(e2, id)); }
      else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));

    el.querySelectorAll('[data-ad-preview]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = 'Cargando…';
      const preview = await api(`/api/meta-ads/ads/${encodeURIComponent(btn.dataset.adPreview)}/preview`);
      btn.disabled = false; btn.textContent = 'Preview';
      if (!preview || !preview.body) return toast('No se pudo generar el preview', 'err');
      showModal('Vista previa del anuncio', `<div class="ma-preview-frame">${preview.body}</div>`);
    }));
  }

  // ─── Modal genérico ──────────────────────
  function showModal(title, bodyHtml) {
    const ov = document.createElement('div');
    ov.className = 'ma-modal-ov';
    ov.innerHTML = `<div class="ma-modal"><button class="ma-modal__close" id="maModalClose">✕</button><h3>${esc(title)}</h3><div style="margin-top:12px">${bodyHtml}</div></div>`;
    document.body.appendChild(ov);
    const close = () => ov.remove();
    ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
    ov.querySelector('#maModalClose').addEventListener('click', close);
    return { el: ov, close };
  }

  // VISTA: Audiencias
  // ════════════════════════════════════════════════════════════
  async function renderAudiencesView(el) {
    const audiences = await apiOrThrow('/api/meta-ads/audiences');
    audiencesCache = audiences;
    el.innerHTML = `
      <div class="ma-sec">
        <h3>Audiencias personalizadas</h3>
        <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">
          <button class="ma-btn ma-btn--gold" id="maSyncLeads">Sincronizar leads del CRM</button>
          <button class="ma-btn" id="maCreateAudience">Crear audiencia manual</button>
        </div>
        <div id="maAudList">${audiences.length === 0 ? '<div class="ma-empty">No hay audiencias creadas aún.</div>' : audiences.map(audienceRowHtml).join('')}</div>
      </div>
    `;

    document.getElementById('maSyncLeads').addEventListener('click', async (e) => {
      if (!confirm('¿Crear una audiencia nueva con todos los leads activos del CRM?')) return;
      e.target.disabled = true; e.target.textContent = 'Sincronizando…';
      const name = 'SP CRM — Leads ' + new Date().toLocaleDateString('es-CO');
      const r = await api('/api/meta-ads/audiences', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, leads: [] }) });
      if (r && r.id) {
        const sync = await api(`/api/meta-ads/audiences/${r.id}/sync-leads`, { method: 'POST' });
        if (sync && !sync.error) toast(`${sync.synced} leads sincronizados`, 'ok'); else toast('Audiencia creada, pero falló la sincronización: ' + errMsg(sync), 'err');
        renderSection(el, renderAudiencesView);
      } else { toast('Error: ' + errMsg(r), 'err'); e.target.disabled = false; e.target.textContent = 'Sincronizar leads del CRM'; }
    });

    document.getElementById('maCreateAudience').addEventListener('click', async () => {
      const name = prompt('Nombre de la audiencia:');
      if (!name) return;
      const r = await api('/api/meta-ads/audiences', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, leads: [] }) });
      if (r && r.id) { toast('Audiencia creada', 'ok'); renderSection(el, renderAudiencesView); }
      else toast('Error: ' + errMsg(r), 'err');
    });

    bindAudienceActions(el, () => renderSection(el, renderAudiencesView));
  }

  function audienceRowHtml(a) {
    return `
      <div class="ma-aud" data-aud="${esc(a.id)}">
        <div class="ma-aud__info"><div class="ma-aud__name">${esc(a.name)}</div><div class="ma-aud__meta">${fmt(a.approximate_count || 0)} personas · ${esc(a.status || 'UNKNOWN')}</div></div>
        <div class="ma-aud__actions">
          <button class="ma-btn ma-btn--xs" data-sync-aud="${esc(a.id)}">Actualizar</button>
          <button class="ma-btn ma-btn--xs" data-lookalike="${esc(a.id)}">Lookalike</button>
          <button class="ma-btn ma-btn--xs ma-btn--danger" data-del-aud="${esc(a.id)}">Borrar</button>
        </div>
      </div>`;
  }

  function bindAudienceActions(root, onDone) {
    root.querySelectorAll('[data-sync-aud]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      const r = await api(`/api/meta-ads/audiences/${btn.dataset.syncAud}/sync-leads`, { method: 'POST' });
      if (r && !r.error) toast(`${r.synced} leads actualizados`, 'ok'); else toast('Error: ' + errMsg(r), 'err');
      onDone();
    }));
    root.querySelectorAll('[data-lookalike]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Crear audiencia Lookalike al 1% basada en esta audiencia?')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/audiences/${btn.dataset.lookalike}/lookalike`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ country: 'CO', ratio: 0.01 }) });
      if (r && r.id) { toast('Lookalike creada', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    root.querySelectorAll('[data-del-aud]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Borrar esta audiencia? No se puede deshacer.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/audiences/${btn.dataset.delAud}`, { method: 'DELETE' });
      if (r && r.ok) { toast('Audiencia borrada', 'ok'); onDone(); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
  }

  // ════════════════════════════════════════════════════════════
  // VISTA: Recomendaciones (servicio inteligente) + comparación
  // ════════════════════════════════════════════════════════════
  const TIPO_LABEL = {
    ganadora: '🏆 Campaña ganadora', cpl_alto: '⚠️ CPL alto', sin_resultados: '🚨 Gasto sin resultados',
    ctr_caida: '📉 CTR cayendo', fatiga: '😴 Fatiga creativa', infrautilizada: '💤 Infrautilizada',
  };
  const SEV_CLASS = { 1: 'active', 2: 'paused', 3: 'error' };

  async function renderRecommendations(el) {
    const recs = await apiOrThrow('/api/meta-ads/recommendations');
    el.innerHTML = `
      <div class="ma-sec">
        <h3>Recomendaciones</h3>
        <p>Análisis automático de las campañas activas — CPL real, tendencia de CTR, fatiga creativa y uso del presupuesto. Se recalcula cada vez que entras a esta vista. Las de severidad 3 también avisan por notificación.</p>
        ${!recs.length ? '<div class="ma-empty">Sin recomendaciones por ahora — o las campañas activas todavía no tienen suficientes datos (mínimo 1.000 impresiones y 3 días, "aprendiendo").</div>' : recs.map(r => `
          <div class="ma-camp">
            <div class="ma-camp__top">
              <div class="ma-camp__name">${esc(TIPO_LABEL[r.tipo] || r.tipo)} — ${esc(r.campaignName)}</div>
              <span class="ma-badge ma-badge--${SEV_CLASS[r.severidad] || 'paused'}">Severidad ${r.severidad}</span>

            <p style="margin:8px 0 0;font-size:12.5px;color:var(--text-2)">${esc(r.mensaje)}</p>
            <div class="ma-camp__actions">
              <a class="ma-btn ma-btn--xs" href="#/campaign/${encodeURIComponent(r.campaignId)}">Ver campaña</a>
              ${r.accion.type === 'duplicate' ? `<button class="ma-btn ma-btn--xs ma-btn--gold" data-apply-dup="${esc(r.campaignId)}">Duplicar</button>` : ''}
              ${r.accion.type === 'pause' ? `<button class="ma-btn ma-btn--xs ma-btn--danger" data-apply-pause="${esc(r.campaignId)}">Pausar</button>` : ''}
            </div>
          </div>
        `).join('')}
      </div>

      <div class="ma-sec">
        <h3>Comparar campañas activas</h3>
        <p>Gasto y leads diarios (30 días) lado a lado.</p>
        <button class="ma-btn" id="maCompareBtn" type="button">Comparar</button>
        <div id="maCompareBox" style="margin-top:12px"></div>
      </div>
    `;

    el.querySelectorAll('[data-apply-dup]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Duplicar esta campaña? La copia se crea PAUSADA.')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.applyDup)}/duplicate`, { method: 'POST' });
      if (r && r.ok) { toast('Campaña duplicada', 'ok'); renderSection(el, renderRecommendations); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));
    el.querySelectorAll('[data-apply-pause]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('¿Pausar esta campaña ahora mismo?')) return;
      btn.disabled = true;
      const r = await api(`/api/meta-ads/campaigns/${encodeURIComponent(btn.dataset.applyPause)}/pause`, { method: 'PUT' });
      if (r && r.ok) { toast('Campaña pausada', 'ok'); renderSection(el, renderRecommendations); } else { toast('Error: ' + errMsg(r), 'err'); btn.disabled = false; }
    }));

    document.getElementById('maCompareBtn').addEventListener('click', async () => {
      const box = document.getElementById('maCompareBox');
      box.innerHTML = '<div class="ma-loading"><div class="ma-spinner"></div> Comparando…</div>';
      const campaigns = await api('/api/meta-ads/campaigns');
      const active = (Array.isArray(campaigns) ? campaigns : []).filter(c => c.status === 'ACTIVE').slice(0, 6);
      if (active.length < 2) { box.innerHTML = '<div class="ma-empty">Se necesitan al menos 2 campañas activas para comparar.</div>'; return; }
      const data = await api('/api/meta-ads/compare?ids=' + active.map(c => encodeURIComponent(c.id)).join(','));
      if (!data) { box.innerHTML = '<div class="ma-error"><p>Error cargando la comparación</p></div>'; return; }
      const totals = active.map(c => {
        const series = data[c.id] || [];
        const spend = series.reduce((s, d) => s + d.spend, 0);
        const leads = series.reduce((s, d) => s + d.leads, 0);
        const impressions = series.reduce((s, d) => s + d.impressions, 0);
        return { name: c.name, spend, leads, impressions, cpl: leads > 0 ? spend / leads : 0 };
      });
      box.innerHTML = `<table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr style="color:var(--text-3);text-transform:uppercase;font-size:9.5px;letter-spacing:.05em">
          <th style="text-align:left;padding:6px 8px">Campaña</th><th style="text-align:right;padding:6px 8px">Impresiones</th>
          <th style="text-align:right;padding:6px 8px">Gasto</th><th style="text-align:right;padding:6px 8px">Leads</th><th style="text-align:right;padding:6px 8px">CPL</th></tr></thead>
        <tbody>${totals.map(t => `<tr style="border-top:1px solid var(--border)">
          <td style="padding:6px 8px">${esc(t.name)}</td>
          <td style="text-align:right;padding:6px 8px">${fmt(t.impressions)}</td>
          <td style="text-align:right;padding:6px 8px">${fmtMoney(t.spend)}</td>
          <td style="text-align:right;padding:6px 8px">${fmt(t.leads)}</td>
          <td style="text-align:right;padding:6px 8px">${t.cpl ? fmtMoney(Math.round(t.cpl)) : '—'}</td>
        </tr>`).join('')}</tbody>
      </table>`;
    });
  }

  // ════════════════════════════════════════════════════════════
  const OBJECTIVES = [
    { v: 'OUTCOME_LEADS', l: 'Leads (mensajes)' },
    { v: 'OUTCOME_TRAFFIC', l: 'Tráfico' },
    { v: 'OUTCOME_ENGAGEMENT', l: 'Interacción' },
    { v: 'OUTCOME_SALES', l: 'Ventas' },
    { v: 'OUTCOME_AWARENESS', l: 'Reconocimiento' },
  ];
  const CTAS_WHATSAPP = [{ v: 'WHATSAPP_MESSAGE', l: 'Enviar mensaje' }];
  const CTAS_WEB = [
    { v: 'LEARN_MORE', l: 'Más información' }, { v: 'CONTACT_US', l: 'Contáctanos' },
    { v: 'SIGN_UP', l: 'Regístrate' }, { v: 'GET_QUOTE', l: 'Cotizar' },
  ];

  function freshWizard() {
    return {
      step: 1,
      objective: 'OUTCOME_LEADS', destination: 'whatsapp',
      campaignName: '', budgetMode: 'lifetime', budgetCOP: '', durationDays: '8',
      targeting: { cities: [], ageMin: 18, ageMax: 65, genders: [], interests: [], customAudienceIds: [], excludedCustomAudienceIds: [] },
      creative: { type: 'image', imageHashes: [], imagePreviews: [], videoId: null, videoPreviewUrl: null, videoUploading: false, videoStatus: '', cards: [], primaryText: '', headline: '', description: '', cta: 'WHATSAPP_MESSAGE', linkUrl: '' },
      citySearch: '', cityResults: [], interestSearch: '', interestResults: [],
      reachEstimate: null, submitting: false,
    };
  }
  let wizard = freshWizard();

  async function renderWizard(el) {
    if (!wizard) wizard = freshWizard();
    if (audiencesCache === null) { try { audiencesCache = await api('/api/meta-ads/audiences') || []; } catch (e) { audiencesCache = []; } }
    el.innerHTML = `
      <div class="ma-steps">
        ${[1,2,3,4,5].map(n => `<div class="ma-step ${wizard.step === n ? 'active' : wizard.step > n ? 'done' : ''}">${n}. ${['Objetivo','Presupuesto','Segmentación','Creativo','Revisión'][n-1]}</div>`).join('')}
      </div>
      <div id="maWizStep"></div>
    `;
    renderWizardStep(document.getElementById('maWizStep'));
  }

  function wizNavButtons(canNext, nextLabel) {
    return `<div style="display:flex;gap:10px;margin-top:18px">
      ${wizard.step > 1 ? '<button class="ma-btn" id="wizPrev">← Atrás</button>' : ''}
      <button class="ma-btn ma-btn--gold" id="wizNext" ${canNext ? '' : 'disabled'}>${nextLabel || 'Siguiente →'}</button>
    </div>`;
  }
  function bindWizNav(container, onNext, validate) {
    const prev = container.querySelector('#wizPrev');
    if (prev) prev.addEventListener('click', () => { wizard.step--; renderWizardStep(container.parentElement || container); });
    const next = container.querySelector('#wizNext');
    if (next) next.addEventListener('click', async () => {
      if (validate && !validate()) return;
      await onNext();
    });
  }

  async function renderWizardStep(el) {
    const step = wizard.step;
    if (step === 1) return renderWizStep1(el);
    if (step === 2) return renderWizStep2(el);
    if (step === 3) return renderWizStep3(el);
    if (step === 4) return renderWizStep4(el);
    if (step === 5) return renderWizStep5(el);
  }

  function renderWizStep1(el) {
    el.innerHTML = `
      <div class="ma-sec">
        <h3>1 · Objetivo y destino</h3>
        <div class="ma-form-row"><label>Objetivo de la campaña</label>
          <div class="ma-seg">${OBJECTIVES.map(o => `<button type="button" data-obj="${o.v}" class="${wizard.objective === o.v ? 'active' : ''}">${o.l}</button>`).join('')}</div>
        </div>
        <div class="ma-form-row"><label>Destino del anuncio</label>
          <div class="ma-seg">
            <button type="button" data-dest="whatsapp" class="${wizard.destination === 'whatsapp' ? 'active' : ''}">WhatsApp</button>
            <button type="button" data-dest="web" class="${wizard.destination === 'web' ? 'active' : ''}">Sitio web / enlace</button>
          </div>
        </div>
        ${wizard.destination === 'web' ? `<div class="ma-form-row"><label>URL de destino</label><input type="url" id="wizLinkUrl" placeholder="https://…" value="${esc(wizard.creative.linkUrl)}"></div>` : ''}
        <div class="ma-form-row"><label>Nombre de la campaña</label><input type="text" id="wizName" placeholder="Ej: Lotes Girardot · Agosto" value="${esc(wizard.campaignName)}"></div>
      </div>
      ${wizNavButtons(true)}
    `;
    el.querySelectorAll('[data-obj]').forEach(b => b.addEventListener('click', () => { wizard.objective = b.dataset.obj; renderWizStep1(el); }));
    el.querySelectorAll('[data-dest]').forEach(b => b.addEventListener('click', () => {
      wizard.destination = b.dataset.dest;
      wizard.creative.cta = b.dataset.dest === 'whatsapp' ? 'WHATSAPP_MESSAGE' : 'LEARN_MORE';
      renderWizStep1(el);

      if (!wizard.campaignName.trim()) { toast('Falta el nombre de la campaña', 'err'); return false; }

      return true;
    });

      return true;

          <div class="ma-form-hint">${cr.videoUploading ? cr.videoStatus || 'Subiendo…' : (cr.videoId ? '✅ Video listo (' + esc(cr.videoStatus || 'ready') + ')' : 'MP4, hasta 500MB')}</div>

  function bindCardEditorEvents(el) {
    el.querySelectorAll('[data-card-headline]').forEach(inp => inp.addEventListener('input', () => { wizard.creative.cards[Number(inp.dataset.cardHeadline)].headline = inp.value; }));

    el.querySelectorAll('[data-card-rm]').forEach(btn => btn.addEventListener('click', () => { wizard.creative.cards.splice(Number(btn.dataset.cardRm), 1); renderCreativeMedia(document.getElementById('wizCreativeMedia')); }));

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadWizardImages(files, mediaEl, isCarousel) {
    if (!files.length) return;
    if (files.length > 10) { toast('Máximo 10 imágenes', 'err'); return; }
    for (const f of files) { if (f.size > 8 * 1024 * 1024) { toast(`${f.name} supera 8MB`, 'err'); return; } }
    mediaEl.innerHTML = '<div class="ma-loading"><div class="ma-spinner"></div> Subiendo imágenes…</div>';
    try {
      const base64s = await Promise.all(files.map(fileToBase64));
      const previews = await Promise.all(files.map(fileToDataUrl));
      const r = await api('/api/meta-ads/media/images', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ images: base64s }) });
      if (!r || !r.ok) { toast('Error subiendo imágenes: ' + errMsg(r), 'err'); renderCreativeMedia(mediaEl); return; }
      if (isCarousel) {
        r.images.forEach((img, i) => wizard.creative.cards.push({ imageHash: img.hash, previewUrl: previews[i], headline: '', description: '' }));
      } else {
        wizard.creative.imageHashes = [r.images[0].hash];
        wizard.creative.imagePreviews = [previews[0]];
      }
      toast('Imagen(es) subida(s)', 'ok');
    } catch (e) {
      toast('Error leyendo el archivo: ' + e.message, 'err');
    }
    renderCreativeMedia(mediaEl);
    bindCardEditorEvents(mediaEl);
  }

  async function uploadWizardVideo(file, mediaEl) {
    if (file.size > 500 * 1024 * 1024) { toast('El video supera 500MB', 'err'); return; }
    const cr = wizard.creative;
    cr.videoUploading = true; cr.videoStatus = 'Subiendo video…';
    cr.videoPreviewUrl = URL.createObjectURL(file);
    renderCreativeMedia(mediaEl);
    try {
      const form = new FormData();
      form.append('video', file, file.name);
      const r = await api('/api/meta-ads/media/videos', { method: 'POST', body: form });
      if (!r || !r.ok) { toast('Error subiendo video: ' + errMsg(r), 'err'); cr.videoUploading = false; renderCreativeMedia(mediaEl); return; }
      cr.videoId = r.videoId;
      cr.videoStatus = 'Procesando…';
      renderCreativeMedia(mediaEl);
      await pollVideoStatus(cr.videoId, mediaEl);
    } catch (e) {
      toast('Error subiendo el video: ' + e.message, 'err');
      cr.videoUploading = false;
      renderCreativeMedia(mediaEl);
    }
  }

  async function pollVideoStatus(videoId, mediaEl) {
    const cr = wizard.creative;
    for (let i = 0; i < 40; i++) { // hasta ~3-4 min de polling
      await new Promise(r => setTimeout(r, 5000));
      const st = await api(`/api/meta-ads/media/videos/${videoId}/status`);
      if (!st) continue;
      cr.videoStatus = st.status;
      if (st.ready) { cr.videoUploading = false; toast('Video listo', 'ok'); renderCreativeMedia(mediaEl); return; }
      if (st.status === 'error') { cr.videoUploading = false; toast('Meta no pudo procesar el video', 'err'); renderCreativeMedia(mediaEl); return; }
      renderCreativeMedia(mediaEl);
    }
    cr.videoUploading = false;
    toast('El video sigue procesando en Meta — revisa más tarde', 'err');
    renderCreativeMedia(mediaEl);
  }

  // ─── Picker: usar assets ya generados por Campañas SP ──────────
  async function openCampanasSpPicker(wizStepEl) {
    const modal = showModal('Elegir creativos de Campañas SP', '<div class="ma-loading"><div class="ma-spinner"></div> Cargando proyectos…</div>');
    const body = modal.el.querySelector('.ma-modal > div');
    const projects = await api('/api/campanas-sp/projects');
    if (!projects || !projects.length) { body.innerHTML = '<div class="ma-empty">No hay proyectos de Campañas SP generados todavía.</div>'; return; }
    body.innerHTML = projects.map(p => `<div class="ma-csp-project" data-project="${p.id}">${esc(p.name || p.slug)} ${p.status === 'ready' ? '✅' : '⏳'}</div>`).join('');
    body.querySelectorAll('[data-project]').forEach(row => row.addEventListener('click', () => openCampanasSpAssets(row.dataset.project, body, wizStepEl, modal)));
  }

  async function openCampanasSpAssets(projectId, body, wizStepEl, modal) {
    body.innerHTML = '<div class="ma-loading"><div class="ma-spinner"></div> Cargando assets…</div>';
    const assets = await api(`/api/campanas-sp/projects/${projectId}/assets`);
    if (!assets || !assets.assets) { body.innerHTML = '<div class="ma-empty">Este proyecto no tiene assets generados.</div>'; return; }
    const selected = [];
    let html = '';
    if (assets.reel_video) {
      html += `<div style="margin-bottom:8px"><b style="font-size:11px;color:var(--gold);text-transform:uppercase">Reel (video)</b>
        <div class="ma-csp-asset-grid"><div class="ma-csp-asset" data-cat="reel" data-file="reel.mp4"><video src="/api/campanas-sp/projects/${projectId}/file/reel/reel.mp4" muted></video></div></div></div>`;
    }
    for (const [cat, files] of Object.entries(assets.assets)) {
      const imgs = (files || []).filter(f => /\.(png|jpe?g)$/i.test(f));
      if (!imgs.length) continue;
      html += `<div style="margin-top:8px"><b style="font-size:11px;color:var(--gold);text-transform:uppercase">${esc(cat)}</b>
        <div class="ma-csp-asset-grid">${imgs.map(f => `<div class="ma-csp-asset" data-cat="${esc(cat)}" data-file="${esc(f)}"><img src="/api/campanas-sp/projects/${projectId}/file/${encodeURIComponent(cat)}/${encodeURIComponent(f)}" loading="lazy"></div>`).join('')}</div></div>`;
    }
    html += `<div style="margin-top:16px;display:flex;gap:10px"><button class="ma-btn ma-btn--gold" id="cspUseSelected" disabled>Usar seleccionados</button><span id="cspSelCount" style="font-size:12px;color:var(--text-3);align-self:center">0 elegidos</span></div>`;
    body.innerHTML = html;

    body.querySelectorAll('.ma-csp-asset').forEach(card => card.addEventListener('click', () => {
      const key = card.dataset.cat + '/' + card.dataset.file;
      const idx = selected.findIndex(s => s.category === card.dataset.cat && s.filename === card.dataset.file);
      if (idx >= 0) { selected.splice(idx, 1); card.classList.remove('selected'); }
      else {
        const isCarousel = wizard.creative.type === 'carousel';
        const limit = isCarousel ? 10 : 1;
        if (selected.length >= limit) { toast(wizard.creative.type === 'image' ? 'Solo se usa 1 imagen para este tipo' : `Máximo ${limit}`, 'err'); return; }
        selected.push({ category: card.dataset.cat, filename: card.dataset.file });
        card.classList.add('selected');
      }
      document.getElementById('cspSelCount').textContent = selected.length + ' elegido(s)';
      document.getElementById('cspUseSelected').disabled = !selected.length;
    }));

    document.getElementById('cspUseSelected').addEventListener('click', async () => {
      const btn = document.getElementById('cspUseSelected');
      btn.disabled = true; btn.textContent = 'Subiendo a Meta…';
      const r = await api('/api/meta-ads/media/from-project', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projectId: Number(projectId), files: selected }) });
      if (!r || !r.ok) { toast('Error subiendo a Meta: ' + errMsg(r), 'err'); btn.disabled = false; btn.textContent = 'Usar seleccionados'; return; }
      const cr = wizard.creative;
      const failed = r.results.filter(x => x.error);
      if (failed.length) toast(`${failed.length} archivo(s) fallaron al subir`, 'err');
      const ok = r.results.filter(x => !x.error);
      if (cr.type === 'video') {
        const v = ok.find(x => x.type === 'video');
        if (v) { cr.videoId = v.videoId; cr.videoPreviewUrl = `/api/campanas-sp/projects/${projectId}/file/reel/reel.mp4`; cr.videoStatus = 'Procesando…'; cr.videoUploading = true; }
      } else if (cr.type === 'carousel') {
        ok.filter(x => x.type === 'image').forEach(img => cr.cards.push({ imageHash: img.hash, previewUrl: `/api/campanas-sp/projects/${projectId}/file/${img.category}/${img.filename}`, headline: '', description: '' }));
      } else {
        const img = ok.find(x => x.type === 'image');
        if (img) { cr.imageHashes = [img.hash]; cr.imagePreviews = [`/api/campanas-sp/projects/${projectId}/file/${img.category}/${img.filename}`]; }
      }
      toast('Creativos importados desde Campañas SP', 'ok');
      modal.close();
      renderCreativeMedia(document.getElementById('wizCreativeMedia'));
      if (cr.type === 'video' && cr.videoId) pollVideoStatus(cr.videoId, document.getElementById('wizCreativeMedia'));
    });
  }

      const creativePayload = buildCreativePayload(cr);
      const r = await api('/api/meta-ads/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ creative: creativePayload, destination: w.destination, adFormat: 'MOBILE_FEED_STANDARD' }) });
      if (!r || !r.body) { box.innerHTML = `<div class="ma-error"><p>${esc(errMsg(r))}</p></div>`; return; }
      box.innerHTML = `<div class="ma-preview-frame">${r.body}</div>`;
    });

    document.getElementById('wizSubmit').addEventListener('click', async () => {
      const setMsg = (text, kind) => { const m = document.getElementById('wizSubmitMsg'); if (m) { m.textContent = text; m.style.color = kind === 'err' ? '#ff6b6b' : 'var(--text-3)'; } };
      w.submitting = true; renderWizStep5(el);
      const payload = {
        objective: w.objective, destination: w.destination,
        campaignName: w.campaignName, budgetMode: w.budgetMode, budgetCOP: Number(w.budgetCOP),
        durationDays: w.budgetMode === 'lifetime' ? Number(w.durationDays) : null,
        targeting: buildTargetingForApi(t),
        creative: buildCreativePayload(cr),
      };
      const r = await api('/api/meta-ads/campaigns/advanced', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      w.submitting = false;
      if (r && r.ok) {
        toast('Campaña creada — PAUSADA, revísala en Ads Manager', 'ok');
        const newId = r.created.campaign.id;
        wizard = freshWizard();
        status = null; account = null; audiencesCache = null;
        navigate('#/campaign/' + encodeURIComponent(newId));
      } else {
        const detail = errMsg(r) + (r && r.rollback ? ` (rollback: ${r.rollback === 'done' ? 'se deshizo lo creado' : 'revisa Ads Manager, puede haber quedado algo parcial'})` : '');
        setMsg(detail, 'err');
        renderWizStep5(el);
      }
    });

    bindWizNav(el, async () => {}, null);
  }

  function buildCreativePayload(cr) {
    const base = { type: cr.type, primaryText: cr.primaryText, headline: cr.headline, description: cr.description, cta: cr.cta, linkUrl: cr.linkUrl };
    if (cr.type === 'video') return { ...base, videoId: cr.videoId };
    if (cr.type === 'carousel') return { ...base, cards: cr.cards.map(c => ({ imageHash: c.imageHash, headline: c.headline, description: c.description })) };
    return { ...base, imageHashes: cr.imageHashes };
  }

  // ─── Boot ───────────────────────────────
  await render();
})();
</script>
</body>
</html>
