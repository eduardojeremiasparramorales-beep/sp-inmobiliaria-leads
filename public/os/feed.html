<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Leons Group · SP Feed · Admin</title><link rel="stylesheet" href="/fonts/fonts.css">
<script src="/os/theme.js"></script>
<link rel="stylesheet" href="/os/sp-os.css">
</head>
<body>
<script src="/os/sp-shell.js"></script>
<script src="/supervisor/feed-app.js"></script>
<script>
(async function () {
  'use strict';
  const { me, content } = await SPOS.mount({ active: 'feed', title: 'SP Feed', crumb: 'Actividad de la empresa en tiempo real' });
  if (!content) return;

  const ICONS = (window.SPOS && window.SPOS.ICONS) || {};
  const avatarColor = (window.SPOS && SPOS.avatarColor) || (() => '#D4AF37');
  const initials = (window.SPOS && SPOS.initials) || ((n) => String(n || '?').slice(0, 2).toUpperCase());

  window.SPFeed.init({
    host: content,
    me,
    api: SPOS.api,
    toast: (m, k) => SPOS.toast(m, k),
    icons: ICONS,
    avatarColor,
    initials,
    conversacionesUrl: '/os/inbox.html',
  });
})();
</script>
</body>
</html>
